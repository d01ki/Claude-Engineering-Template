name: Security baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked secrets and sensitive filenames
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blocked = []
          for p in filter(None, tracked):
              name = PurePosixPath(p).name
              if (name == ".env" or (name.startswith(".env.") and name != ".env.example")
                  or name == "settings.local.json" or name.endswith(".pem")
                  or "private_key" in name.lower() or p.startswith("secrets/")):
                  blocked.append(p)
          if blocked:
              raise SystemExit("Potential sensitive files tracked: " + ", ".join(blocked))
          print("Tracked sensitive filename baseline: OK")
          PY
